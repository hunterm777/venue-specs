[package]
name = "venue-specs-py"
description = "Python bindings for venue-specs"
version = "2026.1124.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_venue_specs"
crate-type = ["cdylib"]

[dependencies]
venue-specs = { path = "../venue-specs" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
