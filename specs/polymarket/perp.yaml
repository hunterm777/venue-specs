# Polymarket Perps.
# Fees read Nov 24, 2026 from Polymarket's November 2026 fee change notice, which schedules
# new rates for November 25, 2026; the rates in force before then are in history/ and match the
# Perps fees page. Funding and margin rules are read from the Perps funding and margin pages, and
# per-market tick and size steps for ANT, INTC and SNDK from the Perps changelog. Polymarket's
# other perps docs were not readable from here, so those entries are unverified.
# The weekly watcher tracks those pages and opens an issue when they change.
schema_version: 1
venue: polymarket
product: perp
version_of_rules: 2026-11-25

fees:
  taker:
    fee:
      formula: "abs(P * Q) * taker"
      source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md"
      as_of: 2026-11-24
      unit: pUSD
      note: "Fee = abs(Price * Quantity) * Rate on fill notional. Select the rate with tier=."
  maker:
    fee:
      formula: "abs(P * Q) * maker"
      source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md"
      as_of: 2026-11-24
      unit: pUSD
      note: "Negative is a rebate."
  basis:
    value: fill_notional
    source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md"
    as_of: 2026-11-24
    note: "Calculated in pUSD on fill notional."
  tier_evaluation:
    value: 30_day_volume_reevaluated_daily_utc
    source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md"
    as_of: 2026-11-24
    note: "Tiers use 30-day volume and are re-evaluated every UTC day. Account- or market-specific overrides may apply."
  tiers:
    "0":
      min_30d_volume: {value: 0, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, unit: USD, effective_from: null}
      taker: {value: 0.0005, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, effective_from: 2026-11-25}
      maker: {value: 0.0002, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, effective_from: 2026-11-25, note: "Negative is a rebate."}
    "1":
      min_30d_volume: {value: 1000000, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, unit: USD, effective_from: null}
      taker: {value: 0.0004, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, effective_from: 2026-11-25}
      maker: {value: 0.0002, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, effective_from: 2026-11-25, note: "Negative is a rebate."}
    "2":
      min_30d_volume: {value: 5000000, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, unit: USD, effective_from: null}
      taker: {value: 0.00035, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, effective_from: null}
      maker: {value: 0.0001, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, effective_from: 2026-11-25, note: "Negative is a rebate."}
    "3":
      min_30d_volume: {value: 25000000, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, unit: USD, effective_from: null}
      taker: {value: 0.0003, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, effective_from: null}
      maker: {value: 0.00005, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, effective_from: null, note: "Negative is a rebate."}
    "4":
      min_30d_volume: {value: 100000000, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, unit: USD, effective_from: null}
      taker: {value: 0.00027, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, effective_from: null}
      maker: {value: 0.00002, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, effective_from: null, note: "Negative is a rebate."}
    "5":
      min_30d_volume: {value: 500000000, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, unit: USD, effective_from: null}
      taker: {value: 0.00025, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, effective_from: null, note: "The fees page gives the same rate before the Nov 25, 2026 change."}
      maker: {value: -0.00005, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, effective_from: 2026-11-25, note: "Negative is a rebate."}
    "6":
      min_30d_volume: {value: 1000000000, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, unit: USD, effective_from: null}
      taker: {value: 0.0002, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, effective_from: null, note: "The fees page gives the same rate before the Nov 25, 2026 change."}
      maker: {value: -0.0001, source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md", as_of: 2026-11-24, effective_from: 2026-11-25, note: "Negative is a rebate."}
  liquidation_fee:
    value: 0.01
    source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md"
    as_of: 2026-11-24
    effective_from: 2026-11-25
    note: "Share of liquidated notional, charged on top of the maker or taker fee; goes to the Perps insurance fund."

price_grid:
  tick:
    unverified: "Tick size rules are in Polymarket's perps docs and instruments endpoint, not readable here."
    as_of: 2026-11-24
  markets:
    ANT:
      tick: {value: 0.001, source: "https://docs.polymarket.com/changelog/perps", as_of: 2026-11-24, effective_from: "2026-11-19T11:00:00Z", note: "Set in the Nov 19, 2026 maintenance window, which started 2026-11-19T11:00:00Z."}
    INTC:
      tick: {value: 0.001, source: "https://docs.polymarket.com/changelog/perps", as_of: 2026-11-24, effective_from: "2026-11-19T11:00:00Z", note: "Set in the Nov 19, 2026 maintenance window, which started 2026-11-19T11:00:00Z."}
    SNDK:
      tick: {value: 0.001, source: "https://docs.polymarket.com/changelog/perps", as_of: 2026-11-24, effective_from: "2026-11-20T13:00:00Z", note: "Set by the stock split in the Nov 19, 2026 entry; trading resumed 2026-11-20T13:00:00Z."}

size:
  minimum:
    unverified: "Quantity decimals and minimum notional are in Polymarket's perps docs, not readable here."
    as_of: 2026-11-24
  markets:
    ANT:
      step: {value: 0.001, source: "https://docs.polymarket.com/changelog/perps", as_of: 2026-11-24, effective_from: "2026-11-19T11:00:00Z", note: "Set in the Nov 19, 2026 maintenance window, which started 2026-11-19T11:00:00Z."}
    INTC:
      step: {value: 0.001, source: "https://docs.polymarket.com/changelog/perps", as_of: 2026-11-24, effective_from: "2026-11-19T11:00:00Z", note: "Set in the Nov 19, 2026 maintenance window, which started 2026-11-19T11:00:00Z."}
    SNDK:
      step: {value: 0.001, source: "https://docs.polymarket.com/changelog/perps", as_of: 2026-11-24, effective_from: "2026-11-20T13:00:00Z", note: "Set by the stock split in the Nov 19, 2026 entry; trading resumed 2026-11-20T13:00:00Z."}

margin:
  max_leverage:
    value: per_market_leverage_tiers
    source: "https://docs.polymarket.com/perps/learn-about-trading/margin.md"
    as_of: 2026-11-24
    note: "Each market has a leverage tier schedule (from Market Data); larger positions must run at lower leverage. The numbers are not on the margin page."
  initial_margin:
    formula: "N / leverage"
    source: "https://docs.polymarket.com/perps/learn-about-trading/margin.md"
    as_of: 2026-11-24
    unit: pUSD
    note: "IM = Notional / Leverage, at your configured leverage, which applies to the whole notional."
  maintenance_margin_rate:
    formula: "0.5 / max_leverage"
    source: "https://docs.polymarket.com/perps/learn-about-trading/margin.md"
    as_of: 2026-11-24
    note: "MMR = 0.5 / MaxLeverage, flat per market, independent of position size, tier and leverage setting; 2.5% on a 20x market."
  maintenance_margin:
    formula: "N * maintenance_margin_rate"
    source: "https://docs.polymarket.com/perps/learn-about-trading/margin.md"
    as_of: 2026-11-24
    unit: pUSD
    note: "MM = Notional x MMR. Liquidation begins when equity falls below MM."

funding:
  interval_hours:
    value: 1
    source: "https://docs.polymarket.com/perps/learn-about-trading/funding.md"
    as_of: 2026-11-24
    note: "Premium samples are averaged over the 1-hour charge window and the hourly rate is settled once at its end."
  sample_interval_seconds:
    value: 5
    source: "https://docs.polymarket.com/perps/learn-about-trading/funding.md"
    as_of: 2026-11-24
  impact_notional:
    value: 1000
    source: "https://docs.polymarket.com/perps/learn-about-trading/funding.md"
    as_of: 2026-11-24
    unit: pUSD
    note: "Quote notional each side of the book is walked for to get bid_impact and ask_impact; a side that cannot fill it falls back to Index."
  premium:
    formula: "(max(bid_impact - index, 0) - max(index - ask_impact, 0)) / index"
    source: "https://docs.polymarket.com/perps/learn-about-trading/funding.md"
    as_of: 2026-11-24
    note: "One 5-second premium index sample."
  rate_8h:
    formula: "scale * (premium_index + clamp(interest_rate_8h - premium_index, -premium_clamp, premium_clamp))"
    source: "https://docs.polymarket.com/perps/learn-about-trading/funding.md"
    as_of: 2026-11-24
    note: "premium_index is the mean of the window's samples; scale is asset_classes.crypto.funding_scale or asset_classes.other.funding_scale."
  rate_hourly:
    formula: "clamp(rate_8h / 8, -cap_per_hour, cap_per_hour)"
    source: "https://docs.polymarket.com/perps/learn-about-trading/funding.md"
    as_of: 2026-11-24
    note: "Positive: longs pay shorts. Funding is a direct transfer between longs and shorts; the protocol takes no cut."
  interest_rate_8h:
    value: 0.0001
    source: "https://docs.polymarket.com/perps/learn-about-trading/funding.md"
    as_of: 2026-11-24
    note: "Fixed interest leg of 0.01% per 8 hours."
  premium_clamp:
    value: 0.0005
    source: "https://docs.polymarket.com/perps/learn-about-trading/funding.md"
    as_of: 2026-11-24
  cap_per_hour:
    value: 0.04
    source: "https://docs.polymarket.com/perps/learn-about-trading/funding.md"
    as_of: 2026-11-24
    note: "4% per hour."

settlement:
  reference:
    unverified: "Index and mark price rules are in Polymarket's perps docs, not readable here."
    as_of: 2026-11-24

position_model:
  margin_mode:
    value: [cross, isolated]
    source: "https://docs.polymarket.com/perps/learn-about-trading/margin.md"
    as_of: 2026-11-24
    note: "Isolated is the default when neither you nor your account group set a mode. Switching needs no position and no open orders in that market."

asset_classes:
  crypto:
    funding_scale: {value: 1.0, source: "https://docs.polymarket.com/perps/learn-about-trading/funding.md", as_of: 2026-11-24}
  other:
    funding_scale: {value: 0.5, source: "https://docs.polymarket.com/perps/learn-about-trading/funding.md", as_of: 2026-11-24, note: "Every market that is not crypto."}
  overrides:
    unverified: "Other differences between crypto and other markets, if any, are in Polymarket's perps FAQ, not readable here."
    as_of: 2026-11-24
