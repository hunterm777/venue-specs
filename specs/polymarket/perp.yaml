    source: "https://docs.polymarket.com/perps/fee-and-liquidity-reward-changes-november-2026.md"
    as_of: 2026-11-24
    effective_from: 2026-11-25
    note: "Share of liquidated notional, charged on top of the maker or taker fee; goes to the Perps insurance fund."

