# Every page and endpoint the weekly watcher fetches. Public pages only.
#
# kind:   markdown | html | rss | json_post | pdf
# parser: <venue>.<function> in watch/parsers/, or omitted for prose-only pages. A change to a
#         page without a parser (or one whose parser reads nothing new) is logged as Docs-only
#         and opens an issue quoting the diff, per the PRD default of no prose extraction.

sources:
  # Kalshi
  - id: kalshi_changelog
    title: Kalshi changelog (RSS)
    venue: kalshi
    products: [binary, perp]
    url: https://docs.kalshi.com/changelog/rss.xml
    kind: rss
    covers: [https://docs.kalshi.com/changelog.md]
  - id: kalshi_fee_rounding
    title: "Kalshi: Fee rounding"
    venue: kalshi
    products: [binary]
    url: https://docs.kalshi.com/getting_started/fee_rounding.md
    kind: markdown
  - id: kalshi_fixed_point
    title: "Kalshi: Fixed-point representation"
    venue: kalshi
    products: [binary]
    url: https://docs.kalshi.com/getting_started/fixed_point_migration
    kind: html
    parser: kalshi.fixed_point
  - id: kalshi_fee_schedule
    title: Kalshi fee schedule (PDF)
    venue: kalshi
    products: [binary, perp]
    url: https://kalshi.com/docs/kalshi-fee-schedule.pdf
    kind: pdf
  - id: kalshi_perps_stock
    title: "Kalshi help: Single stock perpetual futures"
    venue: kalshi
    products: [perp]
    url: https://help.kalshi.com/en/articles/18183683-single-stock-perpetual-futures-on-kalshi
    kind: html
  - id: kalshi_perps_intro
    title: "Kalshi help: What are perpetual futures"
    venue: kalshi
    products: [perp]
    url: https://help.kalshi.com/en/articles/14679970-what-are-perpetual-futures
    kind: html

